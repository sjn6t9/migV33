*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 "Open Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid #bcc7d4;border-radius:8px;padding:8px 14px;cursor:pointer;background:linear-gradient(#fff,#e6ebf1);color:#333;font-weight:700;box-shadow:0 1px 0 #fff inset,0 1px 2px #0002}
button:hover{filter:brightness(.97)}button:active{filter:brightness(.92)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #2f95e099;outline-offset:1px}
button.o{background:linear-gradient(#f9a13a,#e8431a);color:#fff;border-color:#c8340f;text-shadow:0 1px 1px #0004;box-shadow:0 1px 0 #ffd2a0 inset,0 1px 3px #0003}
button:disabled{opacity:.55;cursor:default}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #bcc7d4;border-radius:8px;background:#fff;box-shadow:0 2px 3px #0000001a inset}
input::placeholder{color:#99a3b0}
select option{color:#000}
.lg{background:var(--logo) center/contain no-repeat}
/* ---------- auth (blue textured, like the mig33 start screen) ---------- */
#auth{min-height:100%;display:flex;justify-content:center;padding:28px 18px 24px;color:#fff;
  background:radial-gradient(ellipse at 50% 18%,#2f7bb0 0,#1d5b8a 45%,#123e63 100%);position:relative}
#auth:before{content:"";position:absolute;inset:0;opacity:.18;pointer-events:none;
  background:repeating-linear-gradient(115deg,#fff0 0 7px,#ffffff30 7px 8px),repeating-linear-gradient(25deg,#0000 0 11px,#00000028 11px 12px)}
.box{position:relative;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center}
.box .lg{width:230px;height:140px;margin:4px 0 0;filter:drop-shadow(0 4px 8px #0006)}
.box h1{margin:6px 0 16px;font:600 22px Fredoka,"Open Sans",sans-serif;letter-spacing:.2px;text-shadow:0 1px 2px #0006}
.box form{display:grid;gap:10px;width:100%}
.box input,.box select{padding:14px 14px;font-size:18px;border:1px solid #9fb0c1;box-shadow:0 2px 4px #0003 inset;color:#333}
.box button.o{padding:13px;font-size:21px;font-weight:700;margin-top:4px;border-radius:6px}
.box button.go2{background:none;border:0;box-shadow:none;color:#fff;text-decoration:underline;font-size:15px;font-weight:600;padding:6px}
.ck{display:flex;gap:12px;align-items:center;font-weight:700;font-size:17px;cursor:pointer;color:#fff}
.ck input{appearance:none;-webkit-appearance:none;width:30px;height:30px;padding:0;flex:none;border-radius:5px;border:1px solid #9fb0c1;background:#fff;position:relative;cursor:pointer}
.ck input:checked:after{content:"";position:absolute;left:9px;top:3px;width:8px;height:15px;border:solid #e8431a;border-width:0 4px 4px 0;transform:rotate(40deg)}
.box small{color:#dbe9f5;font-size:15px}
.alt{margin-top:26px;text-align:center}
.alt button{background:none;border:0;box-shadow:none;color:#fff;font:600 21px Fredoka,"Open Sans",sans-serif;text-decoration:underline;letter-spacing:.4px;text-shadow:0 1px 2px #0006}
#err{color:#ffd3cf;min-height:24px;font-weight:700;padding:10px 4px 0;text-align:center;text-shadow:0 1px 2px #0008}
/* ---------- app shell ---------- */
#app{display:none;height:100%;flex-direction:column;width:100%;max-width:none;margin:0;background:var(--sf);box-shadow:0 0 0 1px var(--ln),0 0 30px #0002}
#top{display:flex;align-items:stretch;height:52px;background:linear-gradient(#4a4a4a,#1e1e1e);border-bottom:1px solid #000;flex:none}
#top button{border:0;border-right:1px solid #0009;border-left:1px solid #ffffff1a;border-radius:0;background:none;box-shadow:none;color:#fff;width:54px;padding:0;display:grid;place-items:center;font-size:20px;text-shadow:none}
#top button:hover{background:#ffffff14}#top button.on{background:linear-gradient(#ffd43a,#f2b500)}#top button.on svg{stroke:#222}
#top svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#top .lg{flex:1;margin:4px 0}
#coins{display:flex;align-items:center;padding:0 12px;color:#ffd16a;font-weight:800;font-size:14px;white-space:nowrap}
#sub{display:flex;align-items:center;justify-content:center;height:34px;padding:0 12px;background:linear-gradient(#b5b9be,#8f949a);color:#fff;font-weight:700;font-size:16px;text-shadow:0 1px 1px #0006;border-bottom:1px solid #6f747a;flex:none;gap:8px}
#sub .av{box-shadow:0 0 0 1px #fff8}
#strip{display:none;align-items:center;gap:8px;padding:7px 12px;background:#dde1e5;color:#444;font-size:15px;border-bottom:1px solid #c3c8ce}#strip b{color:#2b7fc0}
#view{flex:1;overflow:auto;padding:0 0 30px;min-height:0;background:var(--sf)}
#view>*{margin-left:0;margin-right:0}
.pad{padding:12px}
#drawer{position:fixed;inset:0;display:none;background:#0008;z-index:5}#drawer.open{display:block}
#drawer nav{width:300px;max-width:86%;height:100%;background:#f1f1f1;overflow:auto;box-shadow:2px 0 12px #0006}
.dsr{display:flex;gap:0;padding:6px;background:linear-gradient(#e9e9e9,#d6d6d6)}
.dsr input{border-radius:6px 0 0 6px;border-right:0;padding:10px 12px}
.dsr button{border-radius:0 6px 6px 0;width:52px;padding:0;display:grid;place-items:center}
.dsr svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round}
.dme{display:flex;gap:10px;padding:8px;background:repeating-linear-gradient(135deg,#fff 0 7px,#e9eef3 7px 14px);border-bottom:1px solid #bbb;cursor:pointer}
.dme .nm{font-weight:800;font-size:18px}.dme .mu{color:#555;font-size:14px;line-height:1.35}
.dh{background:linear-gradient(#444,#1d1d1d);color:#fff;font-weight:800;padding:9px 12px;font-size:16px}
.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-bottom:1px solid #d3d3d3;background:linear-gradient(#f8f8f8,#e7e7e7);padding:14px 14px;font-size:19px;font-weight:600;color:#3a3a3a;border-radius:0;box-shadow:none}
.mi i{font-style:normal;width:34px;text-align:center;font-size:24px;filter:grayscale(1) contrast(1.2)}
.mi.out{color:var(--bad)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px;margin:10px 12px}
.av{display:inline-grid;place-items:center;border-radius:8px;color:#fff;font-weight:800;flex:none;text-shadow:0 1px 1px #0003}
.lv{background:#e6f2fc;color:#2b7fc0;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:800;margin-left:6px;white-space:nowrap}
.row{display:flex;gap:10px;align-items:center}.row>.g{flex:1;min-width:0}
.mu{color:var(--mu);font-size:13px}.pp{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.nm{font-weight:700}
/* feed rows: colour bar on the left like the mig33 home list */
.fr{display:flex;border-bottom:1px solid #dcdcdc;background:#fff}
.fr .bar{width:10px;flex:none}
.fr .bd{flex:1;min-width:0;padding:10px 12px 6px 10px}
.fr .hd{display:flex;gap:10px;align-items:flex-start}
.fr .nm{font-size:19px;line-height:1.2;word-break:break-word}
.fr .tm{margin-left:auto;font-size:13px;color:#555;flex:none;padding-top:2px}
.fr p{margin:3px 0 4px;white-space:pre-wrap;word-break:break-word;color:#333}
.fr .st{text-align:right;color:var(--mu);font-size:12px}
.acts{display:flex;border-top:1px solid #eee;margin-top:6px}.acts button{white-space:nowrap;padding:8px 2px;flex:1;border:0;background:none;border-radius:0;color:#666;box-shadow:none;font-size:14px}.acts button.on{color:var(--ac2)}
.cm{padding:4px 0 8px;display:grid;gap:4px}
.cmp{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#f3f6fa;border-bottom:1px solid #dcdcdc}
.dk{background:linear-gradient(#4a4a4a,#252525);color:#fff;font-weight:800;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-left:10px solid var(--c,#4aa8e8)}
.dk span.n{background:var(--c);color:#fff;border-radius:99px;padding:0 10px;font-size:13px;margin-left:8px;text-shadow:0 1px 1px #0005}
.rm{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #e1e1e1;cursor:pointer;background:#fff}
.rm .rn{color:#2b95e0;font-weight:700;font-size:18px}
.rm button{border:0;background:none;box-shadow:none;font-size:22px;color:#e6a200;padding:2px 8px}
.big{font-size:44px;font-weight:800;color:#2b7fc0}.pos{color:var(--ok)}.neg{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{padding:6px 11px;border-radius:99px}.chips button.on{background:linear-gradient(#f9a13a,#e8431a);color:#fff;border-color:#c8340f}
h2{margin:6px 12px 10px;font-size:20px;color:#2a3340}
.card h2{margin:6px 0 10px}
.tabbar{display:flex;margin:0;background:#d8dde3}.tabbar button{flex:1;border:0;border-radius:0;background:none;box-shadow:none;padding:11px 4px;color:#555;border-bottom:4px solid transparent}.tabbar button.on{background:#fff;color:#2b7fc0;border-bottom-color:var(--ac)}
/* chat */
#chatbox{display:flex;flex-direction:column;height:calc(100dvh - 88px);padding:0}
#ol{margin:0;padding:6px 10px;background:#f3f6fa;border-bottom:1px solid var(--ln);overflow-x:auto;flex-wrap:nowrap;align-items:center;flex:none}
#ol button{flex:none;padding:3px 10px;font-size:13px}
#log{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px;min-height:0}
#log.light{background:#eef2ff;color:#2a3340}#log.navy{background:#0f1d4a;color:#e8eefc}#log.dark{background:#15171d;color:#e6e8ee}
.b{max-width:88%;border-radius:8px;padding:6px 10px;word-break:break-word;border:1px solid #f3e1b0;background:#fff6e0;align-self:flex-start;color:#333}
.b.mine{align-self:flex-end;background:#e9f9e4;border-color:#c4e6ba}
.b b{cursor:pointer}.b small{color:#8a8a8a;margin-left:6px;font-size:12px;white-space:nowrap}
#log.navy .b,#log.dark .b{background:#ffffff14;border-color:#ffffff22;color:#eee}
#log.navy .b.mine,#log.dark .b.mine{background:#2e9d4f33;border-color:#2e9d4f66}
.g2{background:#fff3d6;border:1px solid #f3cf7b;border-radius:8px;padding:6px 10px;color:#9a5b00;font-weight:700;align-self:center;text-align:center}
#log .act{font-style:italic;color:#d98a00;align-self:center}
#tools{padding:6px 10px;background:#f3f6fa;border-top:1px solid var(--ln);margin:0;flex:none}
#tools button{padding:3px 8px;font-size:13px}
#f{padding:8px;background:linear-gradient(#f4f6f9,#dfe4ea);border-top:1px solid #c7ced7;flex:none}
#f input{border-radius:99px;padding:10px 16px}#f button{border-radius:8px;padding:10px 16px;font-size:16px}

/* ================= iOS Liquid Glass (refractive rims, floating capsules, spring motion) ================= */
:root{--ft:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",Roboto,system-ui,sans-serif;
 --lg:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.36));
 --lg2:linear-gradient(135deg,rgba(255,255,255,.86),rgba(255,255,255,.6));
 --rim:inset 1.5px 1.5px 1px rgba(255,255,255,.95),inset -1px -1px 1px rgba(255,255,255,.4),inset 0 0 22px rgba(255,255,255,.28);
 --drop:0 14px 34px rgba(12,44,110,.26),0 2px 6px rgba(12,44,110,.14);
 --bl2:blur(30px) saturate(210%) brightness(1.06);
 --spring:cubic-bezier(.32,1.4,.5,1)}
html,body,button,input,select,textarea{font-family:var(--ft)}
body{letter-spacing:-.01em;background-image:radial-gradient(70vmax 70vmax at 6% 4%,#7fd0ff 0,#7fd0ff00 60%),radial-gradient(60vmax 60vmax at 98% 14%,#ffb15e 0,#ffb15e00 58%),radial-gradient(75vmax 75vmax at 14% 108%,#2a5ad0 0,#2a5ad000 62%),radial-gradient(50vmax 50vmax at 92% 98%,#ff8a3d99 0,#ff8a3d00 60%),linear-gradient(165deg,#58b4f7,#3a78dc 58%,#4d7be6)}
/* surfaces */
.card,.fr,.cmp,.rm,#rbar,#tools,.ph,.dme{background:var(--lg);border:1px solid rgba(255,255,255,.5);box-shadow:var(--rim),var(--drop);backdrop-filter:var(--bl2);-webkit-backdrop-filter:var(--bl2)}
.card{border-radius:28px}.cmp{border-radius:28px;margin:10px}.fr{border-radius:28px;margin:10px}.rm{border-radius:22px;margin:7px 10px 0}.ph{border-radius:30px}
.fr .bar{width:6px;margin:14px 0 14px 8px;border-radius:99px}
.dk{border-radius:22px;background:linear-gradient(135deg,rgba(60,84,140,.7),rgba(20,32,66,.62));border:1px solid rgba(255,255,255,.35);box-shadow:var(--rim),var(--drop);border-left:1px solid rgba(255,255,255,.35)}
.dk:before{content:"";width:8px;align-self:stretch;margin:-9px 10px -9px -12px;border-radius:99px 0 0 99px;background:var(--c,#4aa8e8)}.dk{justify-content:flex-start}.dk>span:last-child{margin-left:auto}
.dk>div{flex:1}
/* floating glass nav */
#top{margin:calc(env(safe-area-inset-top,0px) + 10px) 10px 0;height:56px;border-radius:30px;overflow:hidden;background:linear-gradient(135deg,rgba(40,56,100,.5),rgba(20,30,64,.4));border:1px solid rgba(255,255,255,.42);box-shadow:var(--rim),0 16px 40px rgba(10,30,90,.35);backdrop-filter:var(--bl2);-webkit-backdrop-filter:var(--bl2)}
#top button{width:52px;border:0;background:none;transition:transform .35s var(--spring),background .2s}
#top button:active{transform:scale(.88)}
#top button.on{background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.55),rgba(255,255,255,.14));box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}

#coins{background:rgba(255,255,255,.12);margin:9px 10px 9px 4px;border-radius:99px;padding:0 12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3)}
#sub{background:none;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;height:38px;font-size:17px;font-weight:700;letter-spacing:-.02em}
#strip{margin:0 10px 4px;border-radius:99px;border:1px solid rgba(255,255,255,.6);background:var(--lg);box-shadow:var(--rim);padding:6px 14px}
/* controls: capsules */
button{border-radius:99px;background:linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,.55));border:1px solid rgba(255,255,255,.9);box-shadow:var(--rim),0 4px 12px rgba(20,60,140,.16);font-weight:600;transition:transform .35s var(--spring),filter .2s}
button:active{transform:scale(.95);filter:none}
button.o{background:linear-gradient(rgba(255,178,92,.98),rgba(246,92,28,.97));border:1px solid rgba(255,230,190,.95);box-shadow:inset 1.5px 1.5px 1px rgba(255,255,255,.75),inset -1px -2px 3px rgba(170,40,0,.3),0 8px 20px rgba(245,100,30,.42)}
input,select,textarea{border-radius:18px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.85);box-shadow:inset 0 2px 6px rgba(20,60,140,.14),inset 0 -1px 0 rgba(255,255,255,.7)}
.cmp input,#f input{border-radius:99px}
.chips button,.tabbar button{border-radius:99px}
.tabbar{border-radius:99px;padding:3px;background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.5);box-shadow:var(--rim)}

#f,#recbar{border-radius:99px;background:var(--lg);border:1px solid rgba(255,255,255,.55);box-shadow:var(--rim),var(--drop);backdrop-filter:var(--bl2);-webkit-backdrop-filter:var(--bl2);padding:6px}

/* ---------- Teen Patti Gold table ---------- */
#tp{--panel:#efe8fb;--panelline:#b9a2e8;--ink:#4a2a9a;--gold:#f3d36b;--call:#7239e0;--fold:#cf3a30;--see:#eba035;--danger:#d93a2f;--card:#fff;--red:#c9302c;--black:#1d1d1f}

#tp .seat{width:66px;text-align:center;color:#eaf5ea;font-size:11px;border-radius:10px;padding:3px 2px;border:1.5px solid transparent;position:relative}
#tp .seat.turn{border-color:var(--gold);background:rgba(243,211,107,.16)}
#tp .seat.win{border-color:var(--gold);background:rgba(243,211,107,.28)}
#tp .seat .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#tp .seat.out .nm{text-decoration:line-through;opacity:.8}
#tp .seat .st{display:inline-block;font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;margin-top:2px;background:#e8a23b;color:#fff}

#tp .mini .tpc:first-child, #tp .mini .tpb:first-child{margin-left:0}
#tp .tpc{background:var(--card);border:1px solid #bbb;color:var(--black);display:flex;flex-direction:column;align-items:center;justify-content:center}
#tp .tpc.r{color:var(--red)}
#tp .tpb{background:repeating-linear-gradient(45deg,#b32424 0 3px,#8f1717 3px 6px);border:1px solid #fff}
#tp .potchip{display:inline-flex;gap:6px;align-items:center;border:1.5px solid #2a5a2b;background:#2f6a30;color:#ffe89a;font-weight:800;border-radius:999px;padding:5px 14px;font-size:18px;font-variant-numeric:tabular-nums}
#tp .tpsub{color:#d5e8d5;font-size:12px}
#tp .turnbar{border:1.5px solid #8bc48a;background:#dbe6e0;color:#2a6b2b;font-weight:700;text-align:center;border-radius:10px;padding:8px;margin:8px 0 4px;font-size:15px}
#tp .turnbar.wait{background:#e6e1f5;border-color:var(--panelline);color:#6c55b3;font-weight:600;font-size:13px}
#tp .you{text-align:center;margin-top:4px;font-weight:700;font-size:15px}
#tp .tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:#eba035;color:#fff;margin:0 4px}
#tp .tag.seen{background:#4aa15a}
#tp .tag.out{background:#888}
#tp .tag.allin{background:#c0392b}
#tp .hand{display:flex;justify-content:center;gap:10px;margin:8px 0 2px}
#tp .hand .tpc, #tp .hand .tpb{width:58px;height:82px;border-radius:7px;border:2px solid #7c7c88;font-size:26px;font-weight:800;position:relative}
#tp .hand .tpc small{font-size:22px;line-height:1;margin-top:2px}
#tp .hand .tpb{cursor:pointer}
#tp .hint{text-align:center;font-size:12.5px;color:#7d68c2;margin:2px 0 6px}
#tp .tpacts{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px}
#tp .btn{border:0;border-radius:10px;color:#fff;font-weight:700;font-size:14px;padding:11px 8px;white-space:nowrap;cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
#tp .btn:disabled{opacity:.4;cursor:default}
#tp .btn.see{background:var(--see)}
#tp .btn.call, #tp .btn.raise, #tp .btn.show{background:var(--call)}
#tp .btn.fold{background:var(--fold)}
#tp .showrow{display:flex;justify-content:center;margin-top:8px}
#tp .btn.show{padding:11px 18px}
#tp .btn.go{background:var(--call);width:100%;font-size:16px;padding:13px}
#tp .btn:focus-visible, #tp .ib:focus-visible, #tp .chip:focus-visible{outline:3px solid #1b1464;outline-offset:2px}
#tp .note{text-align:center;font-size:12.5px;color:#7d68c2;margin:8px 0 2px}
#tp .autos{display:flex;gap:8px;justify-content:center;align-items:center;margin-top:6px;font-size:12px;color:#7d68c2;flex-wrap:wrap}
#tp .chip{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--panelline);border-radius:999px;background:#f7f3ff;color:var(--ink);font-weight:600;font-size:13px;padding:6px 12px;cursor:pointer}
#tp .chip .tpdot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink)}
#tp .chip.on .tpdot{background:var(--call);border-color:var(--call)}
#tp .status{text-align:center;font-size:12px;color:#8a76c9;margin-top:6px}
#tp .modal.open{display:flex}
#tp .seat.turn{transition:background .2s,border-color .2s}
#tp{flex:none;max-height:84%;overflow:auto;margin:6px 8px 4px;position:relative}#tp.hid{max-height:none}#tp .tpmin{border:1.5px solid var(--panelline);background:#fff;color:var(--ink);border-radius:50%;width:30px;height:30px;padding:0;font-size:14px;display:grid;place-items:center;box-shadow:none}#tp .btn{box-shadow:none;text-shadow:none;border:0}#tp button.ib,#tp .chip{box-shadow:none}
.b.game{background:#eef4ff;border-color:#c7dafc;color:#2f6fe0;white-space:pre-wrap;align-self:flex-start}.b.game .gn{font-weight:800;color:#2e7d32}#log.navy .b.game,#log.dark .b.game{color:#9cc0ff}
#chatbox #log{min-height:70px}
#tp .felt{min-height:110px;padding:6px}#tp .hand{margin:4px 0 0}#tp .hand .tpc,#tp .hand .tpb{width:50px;height:70px;font-size:22px}#tp .turnbar{margin:6px 0 2px;padding:6px}#tp .note{display:none}#tp{padding:6px 6px 8px;margin:4px 6px}

let tries=0;
function connect(){

  ws.onopen=()=>ws.send(JSON.stringify({t:'auth',token:tok(),offline:isOff()}));
  ws.onmessage=e=>on(JSON.parse(e.data));
  ws.onclose=()=>{if(me)setTimeout(connect,2000);else if(tok()){if(++tries<4)setTimeout(connect,1500);else{delete document.documentElement.dataset.boot}}};
}

  c.toBlob(b=>b?res(b):rej(new Error('Could not read this image.')),'image/jpeg',.85)};i.onerror=()=>rej(new Error('Could not read this image.'));i.src=URL.createObjectURL(file)});

async function micStart(){if(REC)return;
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return alert('Voice recording is not supported on this browser.');
  let st;try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch{return alert('Microphone permission is needed to send voice notes.')}
  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  const mr=new MediaRecorder(st,mt?{mimeType:mt}:{});const ch=[];const t0=Date.now();
  REC={mr,st,t0,send:false,tm:null};
  mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
  mr.onstop=async()=>{const R=REC;REC=null;clearInterval(R.tm);st.getTracks().forEach(t=>t.stop());if($('recbar'))$('recbar').hidden=true;if($('f'))$('f').hidden=false;
    if(!R.send||!ch.length)return;const dur=Math.round((Date.now()-R.t0)/1000);if(dur<1)return;
    try{const url=await upload('voice',new Blob(ch,{type:mr.mimeType||'audio/webm'}));tx({t:'media',kind:'voice',url,dur})}catch(e){fail(e)}};
  mr.start();$('f').hidden=true;$('recbar').hidden=false;
  const tick=()=>{const s=Math.round((Date.now()-t0)/1000);$('rect').textContent=fmtDur(s);if(s>=60)micStop(true)};tick();REC.tm=setInterval(tick,500)}

      await popup({icon:'✨',title:'You won!',body:`You won ${r.amount.toLocaleString()} coins — added to your balance.`,html:`<div class="pw"><b>+${r.amount.toLocaleString()}</b><span>coins</span><div class="mu" style="margin-top:4px">Landed on ${esc(r.prize)}</div></div>`,buttons:[['✓ Continue','o']],sticky:1})},4100)}
  catch(e){delete $('go').dataset.busy;fail(e);paint()}}};
const setSkin=k=>{const r=document.documentElement;try{localStorage.skin=k||'classic'}catch{}
  if(k==='navy'||k==='white'){r.dataset.skin=k;r.dataset.theme=k==='navy'?'dark':'light'}else{delete r.dataset.skin;let t='light';try{t=localStorage.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{}r.dataset.theme=t}
  try{paintTn()}catch{}document.querySelector('meta[name=theme-color]')?.setAttribute('content',k==='navy'?'#0c1d44':k==='white'?'#f4f1ea':r.dataset.theme==='dark'?'#0d1430':'#222')};
V.settings=async()=>{const bg=localStorage.cbg||'light';
  view(`<h2 style="margin-top:12px">Settings</h2><div class="card row" id="spp" style="cursor:pointer">${av(me,48)}<div class="g"><b>Profile photo</b><div class="mu">${AV[me]?'Change or remove your photo':'Add a photo so friends recognise you'}</div></div>📷</div>
  <div class="card row" id="sp" style="cursor:pointer">${av(me)}<div class="g"><b>${esc(me)}</b><span class="lv">${lvi(lv(ST.xp||0),16)}Lv ${lv(ST.xp||0)}</span><div class="mu">Edit profile, status, avatar</div></div>›</div>
  <div class="card"><b>Chat background</b><div class="chips">${['light','navy','dark'].map(k=>`<button data-bg="${k}" class="${bg===k?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div></div>
  <div class="card"><b>App colour</b><div class="chips">${[['navy','Navy Blue (default)'],['white','Off-White'],['classic','Classic gradient']].map(([k,n])=>`<button data-skin="${k}" class="${(localStorage.skin||'navy')===k?'on':''}">${n}</button>`).join('')}</div><div class="mu" style="margin-top:6px">Navy Blue and Off-White use a flat colour (no gradient) with the liquid-glass design.</div></div>
  <div class="card"><b>Status</b><div class="chips"><button id="ss">${ST.presence||'online'} — change</button></div></div>
  <div class="card"><b>Font size</b><div class="chips">${[['s','Small'],['m','Normal'],['l','Large']].map(([k,n])=>`<button data-fs="${k}" class="${(localStorage.fs||'m')===k?'on':''}">${n}</button>`).join('')}</div></div>
  <form id="mpf" class="card" style="display:grid;gap:8px"><b>MPIN ${ST.hasPin?'(set)':'(not set)'}</b><small class="mu">4–6 digits. Needed for coin transfers.</small>${ST.hasPin?'<input id="mpo" type="password" inputmode="numeric" maxlength="6" placeholder="Current MPIN" autocomplete="off">':''}<input id="mpn" type="password" inputmode="numeric" maxlength="6" placeholder="New MPIN (4–6 digits)" autocomplete="off"><button class="o">${ST.hasPin?'Change MPIN':'Set MPIN'}</button></form>
  <form id="sqf" class="card" style="display:grid;gap:8px"><b>Security question ${ST.secQ?'(set)':'(not set)'}</b><small class="mu">${ST.secQ?esc(ST.secQ):'Pick a question and save your answer.'}</small><select id="sqq">${(ST.secQs||[]).map(q=>`<option ${q===ST.secQ?'selected':''}>${esc(q)}</option>`).join('')}</select><input id="sqa" placeholder="Your answer" maxlength="60" autocomplete="off">${ST.secQ?'<input id="sqp" type="password" placeholder="Account password (to change)" autocomplete="current-password">':''}<button class="o">Save security question</button></form>
  <form id="pw" class="card" style="display:grid;gap:8px"><b>Change password</b><input id="po" type="password" placeholder="Current password" autocomplete="current-password"><input id="pn" type="password" placeholder="New password (6+ characters)" autocomplete="new-password"><button class="o">Update password</button></form>
  <button class="mi out card" id="lo">⎋ Log out</button><div class="mu" id="ver" style="text-align:center;margin:8px">App b8 · server …</div>`);
  fetch('/api/version').then(r=>r.json()).then(d=>{$('ver').textContent='App b8 · server '+(d.build||'?')}).catch(()=>{if($('ver'))$('ver').textContent='App b8 · server OLD (no version)'});
  $('sp').onclick=()=>go('profile',me);$('spp').onclick=()=>go('profile',me);$('ss').onclick=e=>statusSheet(e.currentTarget);$('lo').onclick=logout;
  $('pw').onsubmit=async e=>{e.preventDefault();try{await api('POST','/password',{old:$('po').value,pass:$('pn').value});toast('Password updated ✔');V.settings()}catch(er){fail(er)}};
  $('mpf').onsubmit=async e=>{e.preventDefault();try{await api('POST','/security/pin',{pin:$('mpn').value,old:$('mpo')?.value||''});toast('MPIN saved');ST=await api('GET','/me');V.settings()}catch(er){fail(er)}};
  $('sqf').onsubmit=async e=>{e.preventDefault();try{await api('POST','/security/question',{question:$('sqq').value,answer:$('sqa').value,pass:$('sqp')?.value||''});toast('Security question saved');ST=await api('GET','/me');V.settings()}catch(er){fail(er)}};
  $('view').onclick=e=>{const fz=e.target.dataset.fs;if(fz){setFs(fz);V.settings()}const b=e.target.dataset.bg;if(b){localStorage.cbg=b;V.settings()}const s=e.target.closest('button[data-skin]');if(s){setSkin(s.dataset.skin);V.settings()}}};
const MOON='<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4 8.5 8.5 0 1020 14.5z"/></svg>',SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const paintTn=()=>{const d=document.documentElement.dataset.theme==='dark';$('tn').innerHTML=d?SUN:MOON;$('tn').title=d?'Switch to day mode':'Switch to night mode';document.querySelector('meta[name=theme-color]')?.setAttribute('content',d?'#0d1430':'#222')};
$('tn').onclick=()=>{const sk=document.documentElement.dataset.skin;if(sk){setSkin(sk==='navy'?'white':'navy');return}const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.theme=t}catch{}paintTn()};
paintTn();
{let ct;$('coins').onclick=()=>{const c=$('coins');c.classList.add('show');clearTimeout(ct);ct=setTimeout(()=>c.classList.remove('show'),3000)}}
if(tok())connect();

/* auto-hide bars on scroll (phones/tablets): down = hide, up = show */
(()=>{const v=$('view');let last=0,lock=0;
  const set=on=>{if(document.body.classList.contains('hb')===on)return;document.body.classList.toggle('hb',on);lock=Date.now()+250;last=v.scrollTop};
  const hd=$('hdr'),hh=()=>document.getElementById('app').style.setProperty('--hh',hd.offsetHeight+'px');hh();try{new ResizeObserver(hh).observe(hd)}catch{addEventListener('resize',hh)}
  v.addEventListener('scroll',()=>{if(innerWidth>=1000){set(false);return}
    if(Date.now()<lock){last=v.scrollTop;return}
    const y=v.scrollTop,dy=y-last;
    if(y<50||v.scrollHeight-v.clientHeight<160){set(false);last=y;return}
    if(dy>10){set(true);last=y}else if(dy<-10){set(false);last=y}},{passive:true});
  addEventListener('resize',()=>{if(innerWidth>=1000)document.body.classList.remove('hb')})})();
</script>
