### Passport
Make sure your passport is valid well beyond the length of your contract. Many employers ask for at least two years of remaining validity.
### Medical check
Most Gulf countries require a medical test at an approved centre. Your recruiting agency will tell you which centre to use and when.
### Visa and contract
Read your employment contract before you sign it. Check the salary, working hours, food and accommodation terms, and the contract length. Keep a copy.
### Emigration clearance
You need government emigration clearance before departure. Your agency helps with registration and the required documents.
### Keep copies
Scan every document and keep copies with your family in Bangladesh.`},{id:"p2",title:"How to check that a job offer is genuine",date:"2026-10-22T09:00:00.000Z",excerpt:"Fake offers usually ask for money before any interview. Here is how to protect yourself.",body:`Every year workers lose money to fake job offers. A few checks protect you.
### Check the licence
A recruiting agency in Bangladesh must hold a government recruiting licence (RL number). Ask for it and verify it. Mam & Mam Overseas Ltd. holds licence RL 1217.
### Never pay a stranger
Do not send money to individuals or personal accounts for a visa. Pay only at the agency office and always take a receipt.
### Ask for the employer details
A real offer names the employer, the job, the salary in local currency and the contract length.
### Visit the office
Come to our office with your documents. We explain every step before you commit.`},{id:"p3",title:"For employers: hiring skilled workers from Bangladesh",date:"2026-10-07T09:00:00.000Z",excerpt:"From demand letter to deployment: how we source, test and process candidates for your company.",body:`We handle recruitment end to end so your HR team only interviews shortlisted people.
### 1. Demand and job order
Share the trades, numbers, salary and benefits. We prepare the job circular and start sourcing.
### 2. Screening and trade test
Candidates are screened on experience and documents. Trade tests can be arranged for skilled roles.
### 3. Interview
Interview online or in person in Dhaka. Your selections move straight to medical and visa processing.
### 4. Deployment
We complete visa, clearance and travel, and stay in touch after arrival.`}]};var yh=()=>new Date().toISOString();var lm={v:5,session:null,settings:structuredClone(Ll.settings),seo:Ll.seo,packages:[],posts:[],testimonials:[],team:[],gallery:[],stats:{employers:0,hired:0},jobs:[],applications:[],notifications:[],orders:[],messages:[],workers:[],clearances:[],ledger:[],tickets:[],users:[]},S6={q:"",country:"",cat:"",type:"",exp:"",minBdt:"",benefits:[],sort:"new"},q={S:lm,loaded:!1,offline:!1,ui:{tab:{candidate:"overview",employer:"overview",admin:"overview",agent:"overview",staff:"overview"},editJob:null,editPost:null,editWorker:null,agentJob:"",clWorker:"",ledgerAgent:"",clFilter:"all",userFilter:"all",jobFilter:"all",appFilter:{job:"",status:""},F:{...S6},modal:null,toast:"",navOpen:!1,busy:!1}},Bh=0,zl=new Set,Sh=t=>(zl.add(t),()=>zl.delete(t)),Fh=()=>Bh;function W1(){Bh++,zl.forEach(t=>t())}function k1(){return W1(),!0}function kl(t){t&&typeof t=="object"&&"session"in t&&(q.S=t),W1()}async function F6(){try{let t=await fetch("/api/state",{credentials:"same-origin"});kl(await t.json()),q.loaded=!0,q.offline=!1}catch{q.offline=!0}W1()}var M4=()=>q.S,y1=()=>M4().session?M4().users.find(t=>t.id===M4().session):null,Z2=t=>M4().users.find(a=>a.id===t),r2=t=>M4().jobs.find(a=>a.id===t),s0=t=>M4().workers.find(a=>a.id===t),h0=t=>{var a,c;return((c=(a=Z2(t.employerId))==null?void 0:a.company)==null?void 0:c.name)||t.employerName||(t.employerId?"Employer":"")},u0=(t,a)=>`${a} ${Number(t).toLocaleString("en-US")}`,P1=t=>Number(t||0).toLocaleString("en-US"),F0=t=>`BDT ${P1(t)}`,Nh=t=>Number(M4().settings.rates[t]||0),r5=t=>Math.round(t.salaryMin*Nh(t.currency)),k7=t=>Math.round(t.salaryMax*Nh(t.currency)),T3=t=>(t==null?void 0:t.period)==="hour";var Ml=t=>k7(t)*(T3(t)?V3:1),im={en:"en-GB",bn:"bn-BD",ar:"ar-EG",hi:"hi-IN",fj:"en-GB"},a1=t=>t?new Date(t).toLocaleDateString(im[Mt()]||"en-GB",{day:"numeric",month:"short",year:"numeric"}):"\u2014",G0=()=>M4().jobs.filter(t=>t.stat
