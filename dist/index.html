uitment, visa and BMET clearance for workers and employers."}},packages:[{id:"pk1",name:"Basic",price:0,posts:1,featured:0},{id:"pk2",name:"Standard",price:5e3,posts:5,featured:1},{id:"pk3",name:"Premium",price:12e3,posts:15,featured:5}],posts:[{id:"p1",title:"Before you fly: a document checklist for overseas workers",date:"2026-11-04T09:00:00.000Z",excerpt:"Passport validity, medical report, visa, emigration clearance and your employment contract: what to collect and check before departure.",body:`Going abroad for work starts with paperwork. Getting it right early saves weeks later.
### Passport
Make sure your passport is valid well beyond the length of your contract. Many employers ask for at least two years of remaining validity.
### Medical check
Most Gulf countries require a medical test at an approved centre. Your recruiting agency will tell you which centre to use and when.
### Visa and contract
Read your employment contract before you sign it. Check the salary, working hours, food and accommodation terms, and the contract length. Keep a copy.
### Emigration clearance
You need government emigration clearance before departure. Your agency helps with registration and the required documents.
### Keep copies
Scan every document and keep copies with your family in Bangladesh.`},{id:"p2",title:"How to check that a job offer is genuine",date:"2026-10-22T09:00:00.000Z",excerpt:"Fake offers usually ask for money before any interview. Here is how to protect yourself.",body:`Every year workers lose money to fake job offers. A few checks protect you.
### Check the licence
A recruiting agency in Bangladesh must hold a government recruiting licence (RL number). Ask for it and verify it. Mam & Mam Overseas Ltd. holds licence RL 1217.
### Never pay a stranger
Do not send money to individuals or personal accounts for a visa. Pay only at the agency office and always take a receipt.
### Ask for the employer details
A real offer names the employer, the job, the salary in local currency and the contract length.
### Visit the office
Come to our office with your documents. We explain every step before you commit.`},{id:"p3",title:"For employers: hiring skilled workers from Bangladesh",date:"2026-10-07T09:00:00.000Z",excerpt:"From demand letter to deployment: how we source, test and process candidates for your company.",body:`We handle recruitment end to end so your HR team only interviews shortlisted people.
### 1. Demand and job order
Share the trades, numbers, salary and benefits. We prepare the job circular and start sourcing.
### 2. Screening and trade test
Candidates are screened on experience and documents. Trade tests can be arranged for skilled roles.
### 3. Interview
Interview online or in person in Dhaka. Your selections move straight to medical and visa processing.
### 4. Deployment
We complete visa, clearance and travel, and stay in touch after arrival.`}]},qu=["agentId","remark","gccSlipNo","medicalSlipDate","medicalResult","mofaStatus","visaStatus","name","fatherName","motherName","dob","birthPlace","prevNationality","nationality","sex","marital","sect","religion","address","mofaId","oldMofaId","passport","issuePlace","issueDate","expiryDate","validity","visaNo","visaDate","sponsorName","sponsorId","issuePlaceEn","issuePlaceAr","qualificationEn","qualificationAr","professionEn","professionAr","travelPurpose","musaned","wakala","mofaProfession","enjazProfessionAr","enjazProfessionEn","pcUrl","pcRef","licenseNo","licenseType","pcIssueDate","pcOffice","stayEn","stayAr","arrivalEn","arrivalAr","departureEn","departureAr","finger","salary","food","experience","note"],$u=["medicalSlipDate","dob","issueDate","expiryDate","pcIssueDate"],Zu=[["Visa Check","https://visa.mofa.gov.sa/Enjaz/GetVisaInformation/Person"],["Medical Check","https://wafid.com/en/medical-status-search/"],["Mofa Check","https://visa.mofa.gov.sa/VisaPerson/GetApplicantData"],["Medical Update","https://visa.mofa.gov.sa/VisaPerson/CheckMedicalResult"],["Tasheer Finger","https://vc.tasheer.com"],["Takamul","https://svp-international.qiwa.sa"],["Apostille Check","https://mofa-servicedirectory.apostille.mygov.bd"],["PDO/LMS Check","https://training.oep.gov.bd/pdo-certificate"]];var Mi=t=>String(t||"").replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"\u0627").replace(/ى/g,"\u064A").replace(/ة/g,"\u0647").replace(/\s+/g," ").trim(),hc={"\u0633\u0627\u0626\u0642 \u062E\u0627\u0635":"Private Driver",\u0633\u0627\u0626\u0642:"Driver","\u0633\u0627\u0626\u0642 \u0646\u0642\u0644 \u062B\u0642\u064A\u0644":"Heavy Truck Driver","\u0633\u0627\u0626\u0642 \u0634\u0627\u062D\u0646\u0647":"Truck Driver","\u0633\u0627\u0626\u0642 \u0634\u0627\u062D\u0646\u0647 \u062B\u0642\u064A\u0644\u0647":"Heavy Truck Driver","\u0633\u0627\u0626\u0642 \u062D\u0627\u0641\u0644\u0647":"Bus Driver","\u0633\u0627\u0626\u0642
